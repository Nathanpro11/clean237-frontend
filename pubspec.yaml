name: clean237_frontend
description: "A new Flutter project for urban waste management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # 🎯 COUCHE COUPLAGE MVVM & RÉSEAU : Pour lier vos interfaces et attaquer le Backend (Port 3000)
  http: ^1.2.0
  provider: ^6.1.2

  # Icons pour les designs iOS additionnels
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommandations de bonnes pratiques de codage Dart
  flutter_lints: ^6.0.0

flutter:
  # Inclusions des icônes Material Design standards de l'écosystème Google
  uses-material-design: true

  # 🎯 DÉCLARATION DU LOGO : Indique à Flutter d'inclure votre image officielle dans les paquets compilés
  assets:
    - assets/logo.jpeg

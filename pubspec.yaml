name: clean237_frontend
description: "A new Flutter project for urban waste management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Réseau et MVVM (module utilisateurs)
  http: ^1.2.0
  provider: ^6.1.2

  # Icônes
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.5.5

  # Formulaires et validations
  flutter_form_builder: ^9.7.0
  form_builder_validators: ^9.1.0
  google_sign_in: ^7.2.0

  # Module administration (coéquipier)
  google_fonts: ^9.0.0
  go_router: ^18.0.2
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  dio: ^5.8.0+1
  intl: ^0.20.2
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  file_saver: ^0.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg

dependency_overrides:
  intl: ^0.20.3
